<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>契約書作成 | なめがわブラス・ラボ</title>
  <style>
    :root {
      --primary: #1a56db;
      --primary-dark: #1e40af;
      --text: #1f2937;
      --muted: #64748b;
      --border: #cbd5e1;
      --surface: #ffffff;
      --canvas: #e9eef4;
      --danger: #b91c1c;
      --paper-width: 210mm;
      --paper-height: 297mm;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--canvas);
      font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    [hidden] { display: none !important; }

    .login-screen {
      display: grid;
      min-height: 100vh;
      padding: 24px;
      place-items: center;
    }

    .login-panel {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
    }

    .login-panel h1 { margin: 0 0 8px; color: var(--primary-dark); font-size: 1.4rem; }
    .login-panel p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }

    .login-form { display: grid; gap: 12px; }
    .login-form label { font-size: 0.85rem; font-weight: 800; }
    .login-form input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 6px; }
    .login-status { min-height: 1.5em; margin: 0 !important; color: var(--danger) !important; }

    .primary-button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: var(--primary);
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button:hover, .primary-button:focus-visible { background: var(--primary-dark); }

    .generator {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 3px 0 12px rgba(15, 23, 42, 0.08);
    }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .sidebar h1 { margin: 0; color: var(--primary-dark); font-size: 1.35rem; }

    .logout-button {
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      background: #ffffff;
      cursor: pointer;
    }

    .field { display: grid; gap: 6px; margin-bottom: 15px; }
    .field label { font-size: 0.82rem; font-weight: 800; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      background: #ffffff;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .field textarea[data-contract-key="special_terms"] { min-height: 260px; }
    .estimate-editor {
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
    }
    .estimate-edit-guide {
      margin: 4px 0 14px;
      padding: 12px;
      border: 1px solid #60a5fa;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      color: #1e3a8a;
      background: #eff6ff;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .estimate-edit-guide strong { display: block; font-size: 0.9rem; }
    .estimate-editor h2 { margin: 0 0 10px; font-size: 0.9rem; }
    .estimate-editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .estimate-editor-grid label { display: grid; gap: 4px; font-size: 0.75rem; font-weight: 800; }
    .estimate-editor-grid input, .estimate-editor-grid textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #ffffff;
    }
    .estimate-preset {
      width: 100%;
      margin-bottom: 4px;
      padding: 7px 8px;
      border: 1px solid #93c5fd;
      border-radius: 5px;
      color: #1e3a8a;
      background: #eff6ff;
      font-size: 0.75rem;
    }
    .estimate-editor-grid .estimate-description,
    .estimate-editor-grid .estimate-details { grid-column: 1 / -1; }
    .estimate-editor-grid textarea { min-height: 66px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: 3px solid #bfdbfe; border-color: var(--primary); }

    .sidebar-note {
      margin: 18px 0;
      padding: 12px;
      border-left: 3px solid #d97706;
      color: #78350f;
      background: #fffbeb;
      font-size: 0.78rem;
      line-height: 1.6;
    }

    .print-button { width: 100%; margin-top: 6px; }

    .save-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .secondary-button {
      min-height: 44px;
      border: 1px solid var(--primary);
      border-radius: 6px;
      color: var(--primary);
      background: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-button:hover, .secondary-button:focus-visible { background: #eff6ff; }
    .save-status { min-height: 1.5em; margin: 9px 0 0; color: var(--muted); font-size: 0.8rem; }
    .save-status[data-state="error"] { color: var(--danger); }
    .save-status[data-state="success"] { color: #047857; font-weight: 800; }

    .saved-contracts {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .saved-contracts h2 { margin: 0 0 12px; font-size: 1rem; }
    .storage-path { margin: 0 0 12px; color: var(--muted); font-size: 0.75rem; overflow-wrap: anywhere; }
    .saved-contract-actions { display: grid; gap: 8px; }
    .danger-button { border-color: #fecaca; color: var(--danger); }
    .danger-button:hover, .danger-button:focus-visible { background: #fef2f2; }
    .delete-dialog { width: min(440px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 8px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25); }
    .delete-dialog::backdrop { background: rgba(15, 23, 42, 0.55); }
    .delete-dialog-body { padding: 24px; }
    .delete-dialog h2 { margin: 0 0 10px; font-size: 1.15rem; }
    .delete-dialog p { line-height: 1.65; }
    .delete-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .cargo-consent {
      display: flex;
      gap: 9px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #b45309;
      border-radius: 6px;
      color: #78350f;
      background: #fffbeb;
      font-size: 0.8rem;
      font-weight: 800;
      line-height: 1.5;
    }
    .cargo-consent input { flex: 0 0 auto; margin-top: 3px; }
    .cargo-capacity-status { margin-bottom: 14px; padding: 12px; border: 1px solid; border-radius: 6px; font-size: 0.8rem; }
    .cargo-capacity-status strong { display: block; margin-bottom: 3px; }
    .cargo-capacity-status.is-ok { border-color: #16a34a; color: #14532d; background: #f0fdf4; }
    .cargo-capacity-status.is-over { border-color: #dc2626; color: #7f1d1d; background: #fef2f2; }
    .cargo-editor-fieldset { min-width: 0; margin: 14px 0; padding: 0; border: 0; }
    .cargo-editor-fieldset:disabled { opacity: 0.5; }
    .cargo-editor-grid select, .cargo-editor-grid input, .cargo-editor-grid textarea {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 5px; background: #ffffff;
    }
    .cargo-editor-grid label { display: grid; gap: 4px; font-size: 0.75rem; font-weight: 800; }
    .cargo-editor-grid .cargo-instrument { grid-column: span 2; }
    .cargo-row-remove { float: right; border: 0; color: var(--danger); background: transparent; cursor: pointer; font: inherit; }
    .cargo-row-add, .freight-calculator-button { width: 100%; margin-bottom: 14px; }
    .document-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .freight-dialog { width: min(760px, calc(100% - 32px)); max-height: calc(100vh - 40px); padding: 0; border: 0; border-radius: 8px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25); }
    .freight-dialog::backdrop { background: rgba(15, 23, 42, 0.55); }
    .freight-dialog-body { padding: 24px; overflow: auto; }
    .freight-dialog h2 { margin: 0 0 8px; }
    .rate-master-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .rate-master-grid label { display: grid; gap: 4px; font-size: 0.78rem; font-weight: 800; }
    .rate-master-grid input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 5px; }
    .rate-master-grid .rate-wide { grid-column: 1 / -1; }
    .rate-confirm { display: flex !important; grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: start; }
    .rate-confirm input { width: auto; margin-top: 3px; }

    .preview-container {
      display: flex;
      justify-content: center;
      padding: 40px;
      overflow: auto;
    }

    .document {
      display: grid;
      gap: 12mm;
      width: var(--paper-width);
      color: #222222;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    .contract-page {
      width: var(--paper-width);
      height: var(--paper-height);
      padding: 16mm 18mm;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.15);
      font-size: 10pt;
      line-height: 1.6;
    }

    .document h1 { margin: 0 0 20px; text-align: center; font-size: 18pt; letter-spacing: 0; }
    .document h2 { margin: 13px 0 4px; font-size: 10.5pt; }
    .document p { margin: 0 0 7px; }
    .doc-date { margin-bottom: 18px !important; text-align: right; }
    .doc-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 34px; }
    .party-box { min-height: 145px; }
    .party-box + .party-box { padding-left: 20px; border-left: 1px solid #cbd5e1; }
    .doc-parties.with-divider {
      grid-template-columns: minmax(0, 1fr) 1.5px minmax(0, 1fr);
      gap: 14px;
    }
    .party-divider {
      align-self: stretch;
      width: 1.5px;
      background: #222222;
    }
    .party-trade-name { white-space: nowrap; }
    .sign-area { margin-top: 18px; text-align: right; }

    .document table { width: 100%; margin-top: 18px; border-collapse: collapse; }
    .document th, .document td { padding: 9px; border: 1px solid #222222; text-align: left; vertical-align: top; }
    .individual-contract-table {
      border: 1px solid #222222;
      border-right: 0;
      border-collapse: separate !important;
      border-spacing: 0;
      table-layout: fixed;
    }
    .individual-contract-table th, .individual-contract-table td { border: 0; border-bottom: 1px solid #222222; }
    .individual-contract-table th { border-right: 1.5px solid #222222; }
    .individual-contract-table td:last-child { border-right: 1.5px solid #222222; }
    .individual-contract-table tr:last-child > * { border-bottom: 0; }
    .document th { width: 30%; background: #f1f5f9; }
    .document td { white-space: pre-wrap; }

    .estimate-page { font-size: 9pt; line-height: 1.45; }
    .estimate-page h1 { margin-bottom: 10px; }
    .estimate-client { margin: 14px 0 16px; font-size: 11pt; }
    .estimate-total {
      margin: 12px 0;
      padding: 10px 12px;
      border: 2px solid #222222;
      text-align: center;
      font-size: 13pt;
      font-weight: 700;
    }
    .estimate-value {
      margin: 12px 0;
      padding: 10px 12px;
      border-left: 4px solid #1e40af;
      background: #eff6ff;
    }
    .estimate-table { margin-top: 10px !important; font-size: 8pt; }
    .estimate-table th, .estimate-table td { padding: 6px; }
    .estimate-table th { width: auto; }
    .estimate-table .number { width: 13%; text-align: right; white-space: nowrap; }
    .estimate-table .quantity { width: 7%; text-align: center; white-space: nowrap; }
    .estimate-summary { width: 48% !important; margin: 10px 0 0 auto !important; }
    .estimate-summary th, .estimate-summary td { padding: 5px 7px; }
    .estimate-summary td { text-align: right; white-space: nowrap; }
    .estimate-issuer { margin-top: 12px; }
    .estimate-conditions { margin: 0; padding: 0; list-style: none; }
    .estimate-conditions li { margin-bottom: 11px; }
    .estimate-conditions strong { display: block; margin-bottom: 2px; font-size: 9.5pt; }
    .document-links a, .document-url-missing { overflow-wrap: anywhere; }
    .cargo-editor-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) 0.55fr minmax(0, 1fr);
      gap: 8px;
    }
    .cargo-editor-grid .cargo-notes { grid-column: 1 / -1; }
    .cargo-valuation-table { margin-top: 12px !important; font-size: 8pt; table-layout: fixed; }
    .cargo-valuation-table th, .cargo-valuation-table td { padding: 6px; }
    .cargo-valuation-table th { width: auto; }
    .cargo-valuation-table th:nth-child(1) { width: 19%; }
    .cargo-valuation-table th:nth-child(2) { width: 7%; }
    .cargo-valuation-table th:nth-child(3) { width: 9%; }
    .cargo-valuation-table th:nth-child(4),
    .cargo-valuation-table th:nth-child(5) { width: 15%; }
    .cargo-valuation-table th:nth-child(6) { width: 35%; }
    .cargo-valuation-table .number { text-align: right; white-space: nowrap; }
    .cargo-declaration { margin-top: 14px; padding: 10px 12px; border: 1px solid #222222; }
    .estimate-preview-editor {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 3px;
    }
    .estimate-preview-editor select,
    .estimate-preview-editor input {
      width: 100%;
      min-width: 0;
      padding: 4px 5px;
      border: 1px solid #93c5fd;
      border-radius: 4px;
      color: #172554;
      background: #ffffff;
      font: inherit;
    }
    .estimate-preview-editor select { color: #1e40af; background: #eff6ff; }
    .estimate-print-value { display: none; }

    @media (max-width: 900px) {
      .generator { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .preview-container { justify-content: flex-start; padding: 20px; }
      .document, .contract-page { min-width: var(--paper-width); }
    }

    @page { size: A4 portrait; margin: 0; }

    @media print {
      .sidebar { display: none; }
      body, .generator, .preview-container { display: block; min-height: auto; padding: 0; overflow: visible; background: #ffffff; }
      .document {
        display: block;
        width: var(--paper-width);
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .contract-page {
        width: var(--paper-width);
        height: var(--paper-height);
        min-height: var(--paper-height);
        margin: 0;
        padding: 16mm 18mm;
        overflow: hidden;
        box-shadow: none;
        break-after: page;
      }
      .contract-page:last-child { break-after: auto; }
      .document h1, .document h2 { break-after: avoid; }
      .document p { orphans: 3; widows: 3; }
      .document table { break-inside: auto; }
      .document tr, .doc-parties, .party-box { break-inside: avoid; }
      .estimate-preview-editor { display: none; }
      .estimate-print-value { display: inline; }
    }
  </style>
</head>
<body>
  <main class="login-screen" id="loginScreen">
    <section class="login-panel" aria-labelledby="loginTitle">
      <h1 id="loginTitle">管理者用 契約書作成</h1>
      <p>お知らせ管理と同じ管理者パスワードを入力してください。</p>
      <form class="login-form" id="contractLoginForm">
        <label for="contractPassword">管理者パスワード</label>
        <input id="contractPassword" type="password" autocomplete="current-password" required>
        <button class="primary-button" type="submit">開く</button>
        <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <main class="generator" id="contractGenerator" hidden>
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>契約書作成</h1>
        <button class="logout-button" id="contractLogout" type="button" data-history-back data-fallback="../#web">戻る（ログアウト）</button>
      </div>

      <div class="field">
        <label for="docType">契約書の種類</label>
        <select id="docType">
          <optgroup label="共通契約書">
            <option value="master">業務委託基本契約書</option>
          </optgroup>
          <optgroup label="個別契約書">
            <option value="typeA">個別契約書 A（音楽指導・支援）</option>
            <option value="estimateB">B契約前 次世代型御見積書（楽器輸送）</option>
            <option value="typeB">個別契約書 B（楽器輸送）</option>
            <option value="estimateC">C契約前 御見積書（選択・任意入力対応）</option>
            <option value="typeC">個別契約書 C（WEB・アプリ）</option>
          </optgroup>
        </select>
      </div>

      <div class="field">
        <label for="clientName">取引先名（甲）</label>
        <input type="text" id="clientName" maxlength="120" placeholder="例：〇〇高等学校吹奏楽部">
      </div>

      <div class="field">
        <label for="clientRepresentative">代表者名</label>
        <input type="text" id="clientRepresentative" maxlength="80" placeholder="例：代表 山田 太郎">
      </div>

      <div class="field">
        <label for="contractDate" id="documentDateLabel">契約締結日</label>
        <input type="date" id="contractDate">
      </div>

      <div id="dynamicFields"></div>

      <div class="sidebar-note">本機能は契約書案の作成補助です。実際の契約締結前に、案件内容・許認可・保険条件を確認し、必要に応じて専門家の確認を受けてください。</div>
      <div class="save-actions">
        <button class="primary-button" id="saveContract" type="button">部門別に保存</button>
        <button class="secondary-button" id="printContract" type="button">A4縦 PDF出力 / 印刷</button>
      </div>
      <p class="save-status" id="saveStatus" role="status" aria-live="polite"></p>

      <section class="saved-contracts" aria-labelledby="savedContractsTitle">
        <h2 id="savedContractsTitle">保存済み契約書</h2>
        <p class="storage-path" id="contractStoragePath"></p>
        <div class="field">
          <label for="savedContractSelect">部門・取引先から選択</label>
          <select id="savedContractSelect">
            <option value="">保存済み契約書を選択</option>
          </select>
        </div>
        <div class="saved-contract-actions">
          <button class="secondary-button" id="loadContract" type="button">選択した契約書を開く</button>
          <button class="secondary-button danger-button" id="deleteContract" type="button">選択した契約書を削除</button>
        </div>
      </section>
    </aside>

    <section class="preview-container" aria-label="契約書プレビュー">
      <article class="document" id="documentPreview" data-paper-size="A4" data-orientation="portrait"></article>
    </section>
  </main>

  <dialog class="delete-dialog" id="deleteContractDialog" aria-labelledby="deleteContractTitle">
    <div class="delete-dialog-body">
      <section id="deleteConfirmStep">
        <h2 id="deleteContractTitle">契約書を削除しますか？</h2>
        <p id="deleteContractSummary"></p>
        <p>この操作は取り消せません。</p>
        <div class="delete-dialog-actions">
          <button class="secondary-button" id="cancelDeleteContract" type="button">キャンセル</button>
          <button class="secondary-button danger-button" id="continueDeleteContract" type="button">第2確認へ</button>
        </div>
      </section>
      <section id="deleteIdStep" hidden>
        <h2>契約書IDを入力</h2>
        <p>削除対象の契約書IDを正確に入力してください。</p>
        <div class="field">
          <label for="deleteContractId">契約書ID</label>
          <input id="deleteContractId" type="text" autocomplete="off">
        </div>
        <p class="save-status" id="deleteContractError" role="alert"></p>
        <div class="delete-dialog-actions">
          <button class="secondary-button" id="backDeleteContract" type="button">第1確認へ戻る</button>
          <button class="secondary-button danger-button" id="confirmDeleteContract" type="button">完全に削除</button>
        </div>
      </section>
    </div>
  </dialog>

  <dialog class="freight-dialog" id="freightCalculatorDialog" aria-labelledby="freightCalculatorTitle">
    <div class="freight-dialog-body">
      <h2 id="freightCalculatorTitle">適正運賃・料金 自動算出</h2>
      <p>公表資料と自社料金規定を確認してマスターを入力してください。「確認済み」にしない限り見積書へ反映できません。</p>
      <div class="rate-master-grid">
        <label>出発地<input data-freight-input="route_origin" type="text"></label>
        <label>目的地<input data-freight-input="route_destination" type="text"></label>
        <label>実車走行距離（km）<input data-freight-input="route_distance_km" type="number" min="0" step="0.1"></label>
        <label>総拘束時間（時間）<input data-freight-input="total_hours" type="number" min="0" step="0.1"></label>
        <label>料金マスター基準日<input data-rate-key="effective_date" type="date"></label>
        <label class="rate-wide">公表資料・料金規定の出典URL<input data-rate-key="source_url" type="url"></label>
        <label>20kmまでの距離制基本運賃（円）<input data-rate-key="distance_base_20" type="number" min="0"></label>

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatJapaneseDate(value) {
      if (!value) return '令和　年　月　日';
      const [year, month, day] = value.split('-').map(Number);
      return new Intl.DateTimeFormat('ja-JP-u-ca-japanese', {
        year: 'numeric', month: 'long', day: 'numeric'
      }).format(new Date(year, month - 1, day));
    }

      const subtotal = contractValues[type].estimate_items.reduce(

      return { subtotal, tax, total: subtotal + tax };

    function calculateCargoVolume() {
      return contractValues.estimateB.cargo_items.reduce((total, item) => {
        const quantity = Number(item.quantity) || 0;
        const points = Number(item.volume_points) || 0;
        return total + quantity * points;

    function formatCargoCapacity(volume) {
      const formatted = Number(volume).toLocaleString('ja-JP', { maximumFractionDigits: 2 });
      return volume >= 100
        ? `容積スコア ${formatted}pt。軽貨物の運用上限100pt以上のため、外部2t車または往復運行の見積りが必要です。`
        : `容積スコア ${formatted}pt。軽貨物車両1台の運用上限100pt未満です。最終判断は実寸・重量・固定方法・荷姿の現物確認後に行います。`;

        status.querySelector('span').textContent = formatCargoCapacity(volume);

    function calculateOptimalFreight(distance, totalHours) {
      const master = contractValues.estimateB.freight_rate_master;
      if (!master.verified || !master.effective_date || !/^https?:\/\/[^\s]+$/.test(master.source_url)) {
        throw new Error('料金マスターの基準日・出典URLを確認し、確認済みにしてください。');
      }
      if (!contractValues.estimateB.route_origin.trim() || !contractValues.estimateB.route_destination.trim()) {
        throw new Error('出発地と目的地を入力してください。');
      }
      const rate = key => estimateNumber(master[key]);
      if (distance <= 0 || totalHours <= 0 || rate('distance_base_20') <= 0 || rate('charter_4h') <= 0 || rate('charter_8h') <= 0) {
        throw new Error('距離、拘束時間、主要運賃を0より大きい値で入力してください。');
      }
      let distancePrice = rate('distance_base_20');
      let remaining = Math.max(0, distance - 20);
      const distanceBands = [[30, 'distance_per_km_21_50'], [50, 'distance_per_km_51_100'], [Infinity, 'distance_per_km_101_plus']];
      distanceBands.forEach(([limit, key]) => {
        const applied = Math.min(remaining, limit);
        distancePrice += applied * rate(key);
        remaining -= applied;
      });
      let timePrice = totalHours <= 4 && distance <= 40 ? rate('charter_4h') : rate('charter_8h');
      timePrice += Math.max(0, Math.ceil(totalHours - 8)) * rate('extra_hour');
      timePrice += Math.max(0, Math.ceil(distance - 80)) * rate('distance_per_km_101_plus');
      const estimatedWaitingHours = Math.max(0, totalHours - distance / 30 - 1);
      const waitingFee = Math.ceil(estimatedWaitingHours * 2) * rate('waiting_per_30m');
      const distanceBasedTotal = Math.round(distancePrice + waitingFee);
      const volume = calculateCargoVolume();
      const overCapacity = volume >= 100;
      const useTimeCharter = timePrice <= distanceBasedTotal;
      const baseFreightCost = overCapacity
        ? rate('external_2t_charter')
        : Math.round(useTimeCharter ? timePrice : distancePrice);
      if (overCapacity && baseFreightCost <= 0) throw new Error('積載超過のため外部2t車参考チャーター額を入力してください。');
      const loadingSteps = Math.max(0, Math.ceil(volume / 25) - 1);
      const loadingFee = rate('loading_base') + loadingSteps * rate('loading_per_25_points');
      const fuelDifference = Math.max(0, rate('fuel_current_price') - rate('fuel_reference_price'));
      const fuelSurcharge = Math.ceil(fuelDifference * distance * rate('fuel_per_km_per_yen'));
      return {
        recommendedType: overCapacity ? '外部2t車チャーター（要正式見積り）' : useTimeCharter ? '基本運賃（時間制・貸切）' : '基本運賃（距離制）',
        baseFreightCost,
        loadingFee,
        waitingFee,
        fuelSurcharge,
        volume,
        reason: overCapacity
          ? `${contractValues.estimateB.route_origin}から${contractValues.estimateB.route_destination}まで、容積スコア${volume}ptが軽貨物上限に達したため外部2t車参考額を適用`
          : useTimeCharter
            ? `${contractValues.estimateB.route_origin}から${contractValues.estimateB.route_destination}まで、総拘束${totalHours}時間と実車距離${distance}kmを比較し時間制を推奨`
            : `${contractValues.estimateB.route_origin}から${contractValues.estimateB.route_destination}まで、総拘束${totalHours}時間と実車距離${distance}kmを比較し距離制を推奨`
      };
    }

      const values = contractValues.estimateB;
      freightCalculatorDialog.querySelectorAll('[data-freight-input]').forEach(input => { input.value = values[input.dataset.freightInput]; });
      freightCalculatorDialog.querySelectorAll('[data-rate-key]').forEach(input => { input.value = values.freight_rate_master[input.dataset.rateKey]; });
      freightCalculatorDialog.querySelector('[data-rate-verified]').checked = values.freight_rate_master.verified;

    function applyFreightCalculator() {
      const values = contractValues.estimateB;
      freightCalculatorDialog.querySelectorAll('[data-freight-input]').forEach(input => { values[input.dataset.freightInput] = input.value; });
      freightCalculatorDialog.querySelectorAll('[data-rate-key]').forEach(input => { values.freight_rate_master[input.dataset.rateKey] = input.value; });
      values.freight_rate_master.verified = freightCalculatorDialog.querySelector('[data-rate-verified]').checked;
      try {
        const result = calculateOptimalFreight(Number(values.route_distance_km), Number(values.total_hours));
        const [freight, loading, , insurance, fuel] = values.estimate_items;
        Object.assign(freight, { description: result.recommendedType, unit_price: String(result.baseFreightCost), amount: String(result.baseFreightCost), details: `${result.reason}（料金マスター基準日 ${values.freight_rate_master.effective_date}）` });
        Object.assign(loading, { description: '荷役料（積卸し作業費）', unit_price: String(result.loadingFee), amount: String(result.loadingFee), details: `運賃と分離。容積スコア${result.volume}ptに基づく荷役料金` });
        Object.assign(fuel, { description: '燃料サーチャージ', unit_price: String(result.fuelSurcharge), amount: String(result.fuelSurcharge), details: `燃料基準価格との差額と実車距離${values.route_distance_km}kmに基づく` });
        values.waiting_fee = `30分毎に${formatEstimateYen(estimateNumber(values.freight_rate_master.waiting_per_30m))}円（想定待機料 ${formatEstimateYen(result.waitingFee)}円）`;
        values.ancillary_fee = `荷役料とは別の追加作業は料金規定に基づき精算（基本荷役料 ${formatEstimateYen(result.loadingFee)}円）`;
        syncCargoValuation();
        if (insurance) insurance.details = `申告総評価額${formatEstimateYen(calculateCargoValuation())}円に対する補償特約費`;
        freightCalculatorDialog.close();
        renderDynamicFields();
        renderPreview();
      } catch (error) {
        freightCalculatorStatus.textContent = error.message;
        freightCalculatorStatus.dataset.state = 'error';
      }
    }

    async function generateTransportSheet() {
      const status = dynamicFields.querySelector('[data-document-tool-status]');
      if (!contractValues.estimateB.cargo_restrictions_agreed) throw new Error('輸送対象外品の確認へ同意してください。');
      status.textContent = '安全な共有シートを発行しています...';
      const response = await fetch('/api/contracts/transport-sheet', {
        method: 'POST', headers: adminHeaders(), body: JSON.stringify({
          client_name: clientName.value,
          transport_name: contractValues.estimateB.transport_name,
          editor_email: contractValues.estimateB.cargo_contact_email,
          cargo_items: contractValues.estimateB.cargo_items,
          freight_rate_master: contractValues.estimateB.freight_rate_master,
          instrument_price_master: contractValues.estimateB.instrument_price_master
        })
      });
      if (!response.ok) throw new Error(await readApiError(response, '輸送明細シートを発行できませんでした。'));
      const result = await response.json();
      contractValues.estimateB.cargo_document_url = result.cargo_url;
      contractValues.estimateB.fee_document_url = result.fee_url;
      renderDynamicFields();
      renderPreview();
      const nextStatus = dynamicFields.querySelector('[data-document-tool-status]');
      nextStatus.textContent = '指定メールだけが編集できる輸送明細・料金規定シートを発行しました。';
      nextStatus.dataset.state = 'success';
    }

    function syncCargoValuation() {

      ) || contractValues.estimateB.estimate_items[3];

      return total;
    }

          <h2>第11条（損害賠償）</h2><p>当事者は、自己の責めに帰すべき事由により相手方に現実かつ直接に生じた通常損害を賠償する。乙の賠償総額は、乙の故意または重過失、生命・身体への損害その他法令上制限できない場合を除き、原因となった個別契約で乙が受領した委託料を上限とする。</p>
          <h2>第12条（契約期間および存続）</h2><p>本契約の期間は締結日から1年間とし、期間満了日の30日前までに書面または電磁的方法による終了通知がない場合は同一条件で1年間更新する。秘密保持、知的財産権、未払金、損害賠償および紛争解決に関する条項は、性質上必要な範囲で契約終了後も存続する。</p>
          <h2>第13条（通知および電磁的記録）</h2><p>契約に関する通知、承認および合意は、書面、電子メールその他内容を保存・再現できる電磁的方法により行うことができる。連絡先を変更した当事者は速やかに通知し、未通知により生じた不利益を負担する。</p>
          <h2>第14条（分離可能性および権利不放棄）</h2><p>本契約の一部が無効または執行不能となっても、その他の条項は影響を受けない。権利を直ちに行使しないことは、その権利の放棄を意味しない。</p>
          <h2>第15条（準拠法、管轄および協議）</h2><p>本契約は日本法に準拠する。本契約に定めのない事項または疑義については甲乙誠実に協議し、解決しない場合は、法令上認められる範囲で乙の主たる事業所所在地を管轄する裁判所を第一審の合意管轄裁判所とする。</p>${parties}
          </section>`;
    }

    function renderIndividualContract(type, date, parties) {
      const values = contractValues[type];
      if (type === 'typeA') {
        preview.innerHTML = `<section class="contract-page" data-page-number="1"><h1>個別契約書 A（音楽指導・地域支援）</h1><p class="doc-date">${date}</p><p>甲と乙は、基本契約に基づき、次のとおり個別契約を締結する。</p>${contractTable([
          ['委託業務の内容', values.work], ['委託料', values.amount], ['契約期間・実施日', values.term],
          ['特記事項', values.special_terms]
        ])}${parties}</section>`;
      } else if (type === 'typeB') {
        preview.innerHTML = `<section class="contract-page" data-page-number="1"><h1>個別契約書 B（楽器輸送）</h1><p class="doc-date">${date}</p><p>甲と乙は、基本契約に基づき、次のとおり個別契約を締結する。</p>${contractTable([
          ['輸送対象物', values.cargo], ['総評価額（事前申告）', values.value], ['運行経路・実施条件', values.route],
          ['特記事項', values.special_terms]
        ])}${parties}</section>`;
      } else {
        preview.innerHTML = `<section class="contract-page" data-page-number="1"><h1>個別契約書 C（WEB・アプリ）</h1><p class="doc-date">${date}</p><p>甲と乙は、基本契約に基づき、次のとおり個別契約を締結する。</p>${contractTable([
          ['成果物・業務内容', values.deliverable], ['委託料', values.amount], ['納期', values.deadline],
          ['特記事項', values.special_terms]
        ])}${parties}</section>`;
      }
    }

    function renderPreview() {
      const type = docType.value;
      preview.dataset.contractType = type;
      const date = formatJapaneseDate(contractDate.value);
      const parties = partyHtml();
      if (type === 'estimateB') {
        const safeClient = escapeHtml(clientName.value || '［取引先名・貴社名］');
        renderTransportEstimate(date, safeClient);
      } else if (type === 'estimateC') {
        const safeClient = escapeHtml(clientName.value || '［取引先名・貴社名］');
        renderWebAppEstimate(date, safeClient);
      } else if (type === 'master') {
        const safeClient = escapeHtml(clientName.value || '＿＿＿＿＿＿＿＿＿＿');
        renderMasterContract(date, safeClient, parties);
      } else {
        renderIndividualContract(type, date, parties);
      }
    }

    function contractPayload() {
      return {
        doc_type: docType.value,
        client_name: clientName.value,
        client_representative: clientRepresentative.value,
        contract_date: contractDate.value,
        values: docType.value === 'master' ? {} : { ...contractValues[docType.value] }
      };
    }

    function adminHeaders() {
      return { 'Content-Type': 'application/json', 'X-Editor-Password': adminPassword };
    }

    async function readApiError(response, fallback) {
      try {
        const result = await response.json();
        return result.error || fallback;
      } catch {
        return fallback;
      }
    }

    async function loadSavedContracts(selectedId = '') {
      const response = await fetch('/api/contracts', { headers: adminHeaders() });
      if (!response.ok) throw new Error(await readApiError(response, '保存済み契約書を取得できませんでした。'));
      const result = await response.json();
      storagePath.textContent = `このPC内の保存先: ${result.storage_path}`;
      savedContractSelect.replaceChildren(new Option('保存済み契約書を選択', ''));
      const groups = new Map();
      result.contracts.forEach(contract => {
        if (!groups.has(contract.department)) groups.set(contract.department, []);
        groups.get(contract.department).push(contract);
      });
      groups.forEach((contracts, department) => {
        const group = document.createElement('optgroup');
        group.label = department;
        contracts.forEach(contract => {
          const option = new Option(
            `${contract.contract_date} / ${contract.client_name}`,
            contract.contract_id
          );
          group.appendChild(option);
        });
        savedContractSelect.appendChild(group);
      });
      savedContractSelect.value = selectedId;
    }

    async function saveCurrentContract() {
      if (!clientName.value.trim()) {
        clientName.focus();
        throw new Error('取引先名を入力してください。');
      }
      saveButton.disabled = true;
      const response = await fetch('/api/contracts', {
        method: 'POST', headers: adminHeaders(), body: JSON.stringify(contractPayload())
      });
      if (!response.ok) {
        saveButton.disabled = false;
        throw new Error(await readApiError(response, '契約書を保存できませんでした。'));
      }
      const contract = await response.json();
      await loadSavedContracts(contract.contract_id);
      saveButton.disabled = false;
      return contract;
    }

    async function openSavedContract() {
      const contractId = savedContractSelect.value;
      if (!contractId) throw new Error('保存済み契約書を選択してください。');
      const response = await fetch(`/api/contracts/${encodeURIComponent(contractId)}`, {
        headers: adminHeaders()
      });
      if (!response.ok) throw new Error(await readApiError(response, '契約書を開けませんでした。'));
      const { contract } = await response.json();
      docType.value = contract.doc_type;
      clientName.value = contract.client_name;
      clientRepresentative.value = contract.client_representative;
      contractDate.value = contract.contract_date;
      if (contract.doc_type !== 'master') {
        contractValues[contract.doc_type] = { ...contractValues[contract.doc_type], ...contract.values };
        if (contract.doc_type === 'estimateB') normalizeTransportValues(contractValues.estimateB);
      }
      renderDynamicFields();
      renderPreview();
      return contract;
    }

    async function deleteSavedContract(contractId, confirmationId) {
      const response = await fetch(`/api/contracts/${encodeURIComponent(contractId)}`, {
        method: 'DELETE', headers: adminHeaders(), body: JSON.stringify({ confirmation_id: confirmationId })
      });
      if (!response.ok) throw new Error(await readApiError(response, '契約書を削除できませんでした。'));
      const result = await response.json();
      await loadSavedContracts();
      return result;
    }

    function showDeleteStep(step) {
      deleteConfirmStep.hidden = step !== 1;
      deleteIdStep.hidden = step !== 2;
      deleteContractError.textContent = '';
      if (step === 2) deleteContractId.focus();
    }

    function showGenerator() {
      loginScreen.hidden = true;
      generator.hidden = false;
      contractDate.value = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
      renderDynamicFields();
      renderPreview();
      loadSavedContracts().catch(error => {
        saveStatus.textContent = error.message;
        saveStatus.dataset.state = 'error';
      });
    }

    async function authenticate(password) {
      const response = await fetch('/api/editor', { headers: { 'X-Editor-Password': password } });
      if (!response.ok) throw new Error('管理者パスワードが違います。');
      adminPassword = password;
      passwordInput.value = '';
      showGenerator();
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginStatus.textContent = '';
      try {
        await authenticate(passwordInput.value);
      } catch (error) {
        loginStatus.textContent = error.message || 'ログインできませんでした。';
        passwordInput.select();
      }
    });

    logoutButton.addEventListener('click', () => {
      adminPassword = '';
      generator.hidden = true;
      loginScreen.hidden = false;
      passwordInput.value = '';
      passwordInput.focus();
    });

    docType.addEventListener('change', () => { renderDynamicFields(); renderPreview(); });
    [clientName, clientRepresentative, contractDate].forEach(input => input.addEventListener('input', renderPreview));
    dynamicFields.addEventListener('input', event => {
      if (event.target.matches('[data-cargo-consent]')) {
        contractValues.estimateB.cargo_restrictions_agreed = event.target.checked;
        const fieldset = dynamicFields.querySelector('[data-cargo-editor]');
        if (fieldset) fieldset.disabled = !event.target.checked;
        renderPreview();
        return;
      }
      const instrumentMasterKey = event.target.dataset.instrumentMasterKey;
      if (instrumentMasterKey) {
        contractValues.estimateB.instrument_price_master[instrumentMasterKey] = event.target.value;
        return;
      }
      if (event.target.matches('[data-instrument-master-verified]')) {
        contractValues.estimateB.instrument_price_master.verified = event.target.checked;
        return;
      }
      const cargoKey = event.target.dataset.cargoItemKey;
      if (cargoKey) {
        const row = event.target.closest('[data-cargo-row]');
        const rowIndex = Number(row?.dataset.cargoRow);
        const item = contractValues.estimateB.cargo_items[rowIndex];
        if (!item) return;
        item[cargoKey] = event.target.value;
        if (cargoKey === 'quantity' || cargoKey === 'unit_value') {
          item.total_value = String(
            estimateNumber(item.quantity) * estimateNumber(item.unit_value)
          );
          const totalInput = row.querySelector('[data-cargo-item-key="total_value"]');
          if (totalInput) totalInput.value = item.total_value;
        }
        syncCargoValuation();
        const editorTotal = dynamicFields.querySelector('[data-cargo-total="editor"]');
        if (editorTotal) editorTotal.textContent = `${formatEstimateYen(calculateCargoValuation())}円`;
        updateCargoCapacityUi();
        renderPreview();
        return;
      }
      const estimateKey = event.target.dataset.estimateKey;
      if (estimateKey) {
        const row = event.target.closest('[data-estimate-row]');
        const rowIndex = Number(row?.dataset.estimateRow);
        const item = contractValues[docType.value]?.estimate_items?.[rowIndex];
        if (!item) return;
        item[estimateKey] = event.target.value;
        if (estimateKey === 'quantity' || estimateKey === 'unit_price') {
          const quantity = Number(String(item.quantity).replace(/,/g, ''));
          const unitPrice = estimateNumber(item.unit_price);
          if (Number.isFinite(quantity) && quantity >= 0 && unitPrice >= 0) {
            item.amount = String(Math.round(quantity * unitPrice));
            const amountInput = row.querySelector('[data-estimate-key="amount"]');
            if (amountInput) amountInput.value = item.amount;
          }
        }
        renderPreview();
        return;
      }
      const key = event.target.dataset.contractKey;
      if (!key) return;
      contractValues[docType.value][key] = event.target.value;
      renderPreview();
    });
    dynamicFields.addEventListener('change', event => {
      if (event.target.matches('[data-cargo-instrument]')) {
        const row = event.target.closest('[data-cargo-row]');
        const item = contractValues.estimateB.cargo_items[Number(row?.dataset.cargoRow)];
        if (!item) return;
        item.instrument_key = event.target.value;
        const master = instrumentMaster[event.target.value];
        if (master) {
          Object.assign(item, {
            category: master.category,
            description: master.name,
            maker_model: master.model,
            valuation_mode: 'master',
            unit_value: String(master.referenceValue),
            volume_points: String(master.volumePoints),
            total_value: String(estimateNumber(item.quantity) * master.referenceValue)
          });
        } else {
          Object.assign(item, { category: 'その他', description: 'その他', maker_model: '', valuation_mode: 'manual', unit_value: '0', total_value: '0', volume_points: '0' });
        }
        renderDynamicFields();
        renderPreview();
        return;
      }
      if (event.target.matches('[data-estimate-preset], [data-estimate-preset-key]')) {
        applyEstimatePreset(event.target);
      }
    });
    dynamicFields.addEventListener('click', async event => {
      if (event.target.closest('[data-open-freight-calculator]')) {
        openFreightCalculator();
        return;
      }
      if (event.target.closest('[data-open-route-map]')) {
        window.open('https://www.google.com/maps/dir/', '_blank', 'noopener,noreferrer');
        return;
      }
      if (event.target.closest('[data-add-cargo-row]')) {
        if (contractValues.estimateB.cargo_items.length >= 10) return;
        contractValues.estimateB.cargo_items.push({ category: 'その他', instrument_key: 'other', description: 'その他', maker_model: '', quantity: '1', condition: '要確認', valuation_mode: 'manual', unit_value: '0', total_value: '0', volume_points: '0', notes: '' });
        renderDynamicFields();
        renderPreview();
        return;
      }
      const removeButton = event.target.closest('[data-remove-cargo-row]');
      if (removeButton) {
        if (contractValues.estimateB.cargo_items.length <= 1) return;
        contractValues.estimateB.cargo_items.splice(Number(removeButton.dataset.removeCargoRow), 1);
        renderDynamicFields();
        renderPreview();
        return;
      }
      if (event.target.closest('[data-generate-transport-sheet]')) {
        try {
          await generateTransportSheet();
        } catch (error) {
          const status = dynamicFields.querySelector('[data-document-tool-status]');
          if (status) {
            status.textContent = error.message;
            status.dataset.state = 'error';
          }
        }
      }
    });
    preview.addEventListener('change', event => {
      const presetKey = event.target.dataset.previewEstimatePreset;
      if (presetKey && event.target.value) {
        const editor = event.target.closest('.estimate-preview-editor');
        const input = editor?.querySelector(`[data-preview-estimate-key="${presetKey}"]`);
        if (input) {
          input.value = event.target.value;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }
        event.target.value = '';
        return;
      }
    });
    preview.addEventListener('input', event => {
      const key = event.target.dataset.previewEstimateKey;
      if (!key) return;
      const estimateType = activeEstimateType();
      if (key === 'project_name' || key === 'transport_name') {
        contractValues[estimateType][key] = event.target.value;
        const sidebarInput = dynamicFields.querySelector(`[data-contract-key="${key}"]`);
        if (sidebarInput) sidebarInput.value = event.target.value;
      } else {
        const rowIndex = Number(event.target.closest('[data-preview-estimate-row]')?.dataset.previewEstimateRow);
        const item = contractValues[estimateType].estimate_items[rowIndex];
        if (!item) return;
        item[key] = event.target.value;
        const sidebarInput = dynamicFields.querySelector(`[data-estimate-row="${rowIndex}"] [data-estimate-key="${key}"]`);
        if (sidebarInput) sidebarInput.value = event.target.value;
        if (key === 'quantity' || key === 'unit_price') {
          const quantity = Number(String(item.quantity).replace(/,/g, ''));
          const unitPrice = estimateNumber(item.unit_price);
          if (Number.isFinite(quantity) && quantity >= 0) {
            item.amount = String(Math.round(quantity * unitPrice));
            const amountInput = preview.querySelector(`[data-preview-estimate-row="${rowIndex}"] [data-preview-estimate-key="amount"]`);
            const sidebarAmount = dynamicFields.querySelector(`[data-estimate-row="${rowIndex}"] [data-estimate-key="amount"]`);
            if (amountInput) amountInput.value = item.amount;
            if (sidebarAmount) sidebarAmount.value = item.amount;
            const amountPrintValue = amountInput?.closest('.estimate-preview-editor')?.nextElementSibling;
            if (amountPrintValue?.classList.contains('estimate-print-value')) amountPrintValue.textContent = item.amount;
          }
        }
      }
      const printValue = event.target.closest('.estimate-preview-editor')?.nextElementSibling;
      if (printValue?.classList.contains('estimate-print-value')) printValue.textContent = event.target.value;
      updateEstimatePreviewTotals();
    });
    document.getElementById('printContract').addEventListener('click', () => window.print());
    document.getElementById('cancelFreightCalculator').addEventListener('click', () => freightCalculatorDialog.close());
    document.getElementById('applyFreightCalculator').addEventListener('click', applyFreightCalculator);
    saveButton.addEventListener('click', async () => {
      saveStatus.textContent = '保存しています...';
      saveStatus.dataset.state = '';
      try {
        const contract = await saveCurrentContract();
        saveStatus.textContent = `${contract.department}フォルダへ保存しました。`;
        saveStatus.dataset.state = 'success';
      } catch (error) {
        saveButton.disabled = false;
        saveStatus.textContent = error.message || '契約書を保存できませんでした。';
        saveStatus.dataset.state = 'error';
      }
    });
    loadButton.addEventListener('click', async () => {
      saveStatus.textContent = '';
      saveStatus.dataset.state = '';
      try {
        const contract = await openSavedContract();
        saveStatus.textContent = `${contract.department}の契約書を開きました。`;
        saveStatus.dataset.state = 'success';
      } catch (error) {
        saveStatus.textContent = error.message || '契約書を開けませんでした。';
        saveStatus.dataset.state = 'error';
      }
    });
    deleteButton.addEventListener('click', () => {
      saveStatus.textContent = '';
      saveStatus.dataset.state = '';
      pendingDeleteContractId = savedContractSelect.value;
      if (!pendingDeleteContractId) {
        saveStatus.textContent = '削除する保存済み契約書を選択してください。';
        saveStatus.dataset.state = 'error';
        return;
      }
      document.getElementById('deleteContractSummary').textContent = savedContractSelect.selectedOptions[0]?.textContent || pendingDeleteContractId;
      deleteContractId.value = '';
      showDeleteStep(1);
      deleteDialog.showModal();
    });
    document.getElementById('cancelDeleteContract').addEventListener('click', () => deleteDialog.close());
    document.getElementById('continueDeleteContract').addEventListener('click', () => showDeleteStep(2));
    document.getElementById('backDeleteContract').addEventListener('click', () => showDeleteStep(1));
    document.getElementById('confirmDeleteContract').addEventListener('click', async () => {
      const confirmationId = deleteContractId.value.trim();
      if (confirmationId !== pendingDeleteContractId) {
        deleteContractError.textContent = '契約書IDが一致しません。';
        return;
      }
      try {
        const result = await deleteSavedContract(pendingDeleteContractId, confirmationId);
        deleteDialog.close();
        saveStatus.textContent = result.deleted_count > 1
          ? 'PC内・サーバー内の保存済み契約書を削除しました。'
          : '保存済み契約書をサーバーから削除しました。';
        saveStatus.dataset.state = 'success';
      } catch (error) {
        deleteContractError.textContent = error.message || '契約書を削除できませんでした。';
      }
    });

  </script>
</body>
</html>
