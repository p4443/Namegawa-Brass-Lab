<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>動画一覧</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 32px 20px 48px;
      background: #f5f7fb;
      color: #123;
      line-height: 1.7;
    }
    .card {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      padding: 24px 28px;
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { margin: 0 0 16px; color: #556; }
    ul { padding-left: 20px; }
    li { margin-bottom: 10px; }
    a { color: #0a5cff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>動画一覧</h1>
    <p>このページはディレクトリリスティングではなく、動画への入口です。</p>
    <ul>
      <li><a href="intro.mp4">intro.mp4</a></li>
    </ul>
  </main>
</body>
</html>
