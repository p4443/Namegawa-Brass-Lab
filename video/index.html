<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="滑川町ふれあいコンサートの交流動画です。">
  <title>滑川町ふれあいコンサート | なめがわブラス・ラボ</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #070b0f;
      --paper: #f7f2e7;
      --gold: #f3bf4f;
      --cyan: #53d4d1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--paper);
      background:
        linear-gradient(rgba(83, 212, 209, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(83, 212, 209, 0.08) 1px, transparent 1px),
        var(--ink);
      background-size: 44px 44px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    .screen {
      display: grid;
      min-height: 100vh;
      grid-template-rows: auto 1fr auto;
    }

    .title-telop,
    .credit-telop {
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .title-telop {
      padding: 26px clamp(20px, 5vw, 72px) 22px;
      border-bottom: 1px solid rgba(243, 191, 79, 0.55);
      background: rgba(7, 11, 15, 0.94);
    }

    .title-telop::after {
      position: absolute;
      right: -30px;
      bottom: -72px;
      width: 210px;
      height: 150px;
      border: 18px solid rgba(243, 191, 79, 0.2);
      border-radius: 50%;
      content: "";
      transform: rotate(-12deg);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--cyan);
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
    }

    .event-label {
      margin: 0 0 5px;
      color: var(--gold);
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: clamp(0.72rem, 1.5vw, 0.9rem);
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    h1 {
      max-width: 1100px;
      margin: 0;
      font-size: clamp(1.75rem, 4.2vw, 4.15rem);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.12;
    }

    .event-detail {
      display: flex;
      margin: 14px 0 0;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: #dce7e7;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: clamp(0.82rem, 1.5vw, 1rem);
    }

    .event-detail span:first-child {
      color: var(--gold);
      font-weight: 800;
    }

    .player-stage {
      display: grid;
      min-height: 0;
      padding: clamp(18px, 3vw, 36px);
      place-items: center;
    }

    .player-frame {
      width: min(100%, 1180px);
    }

    video {
      display: block;
      width: 100%;
      max-height: 66vh;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #000000;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.62);
    }

    .play-button {
      display: block;
      width: min(calc(100% - 32px), 320px);
      min-height: 52px;
      margin: 16px auto 0;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 6px;
      color: #071014;
      background: var(--gold);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      font: 800 1rem/1 "Hiragino Sans", "Yu Gothic", sans-serif;
      cursor: pointer;
    }

    .credit-telop {
      display: flex;
      min-height: 86px;
      padding: 20px clamp(20px, 5vw, 72px);
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-top: 1px solid rgba(83, 212, 209, 0.55);
      background: var(--paper);
      color: #111820;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    .credit-telop::before {
      width: 48px;
      height: 5px;
      flex: 0 0 auto;
      background: var(--gold);
      content: "";
    }

    .credit-telop p {
      margin: 0 auto 0 0;
      font-size: clamp(0.9rem, 2vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0;
    }

    .credit-telop strong {
      display: block;
      margin-top: 4px;
      color: #a64e00;
      font-size: 0.82em;
    }

    @media (max-width: 600px) {
      .title-telop {
        padding: 18px 18px 20px;
      }

      .back-link {
        margin-bottom: 12px;
      }

      .event-label {
        font-size: 0.7rem;
        line-height: 1.4;
      }

      h1 {
        font-size: 1.65rem;
        line-height: 1.3;
      }

      .event-detail {
        display: grid;
        margin-top: 10px;
        gap: 2px;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .event-detail span {
        display: block;
      }

      .event-detail span:last-child {
        color: #e6eeee;
      }

      .player-stage {
        padding: 16px 0;
      }

      video {
        width: 100%;
        max-height: 55vh;
        border-right: 0;
        border-left: 0;
      }

      .credit-telop {
        min-height: 74px;
        padding: 16px 20px;
        gap: 12px;
      }

      .credit-telop::before {
        width: 28px;
      }

      .credit-telop p {
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .credit-telop strong {
        margin-top: 2px;
        font-size: 0.78rem;
        line-height: 1.45;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="title-telop">
      <a class="back-link" href="../#features">← 3つの輪へ戻る</a>
      <p class="event-label">NAMEGAWA FUREAI CONCERT</p>
      <h1>滑川町ふれあいコンサート</h1>
      <p class="event-detail">
        <span>2026年5月10日（日）</span>
        <span>滑川町コミュニティセンターにて</span>
      </p>
    </header>

    <main class="player-stage">
      <div class="player-frame">
        <video controls playsinline preload="metadata" aria-label="滑川町ふれあいコンサートの動画">
          <source src="generations.mp4?v=20260817" type="video/mp4">
          お使いのブラウザーは動画再生に対応していません。
        </video>
        <button class="play-button" type="button">▶ 音声をオンにして再生</button>
      </div>
    </main>

    <footer class="credit-telop">
      <p>まるっと！2026年5月18日号<strong>【制作：東松山ケーブルテレビ】</strong></p>
    </footer>
  </div>
  <script>
    const video = document.querySelector("video");
    const playButton = document.querySelector(".play-button");

    playButton.addEventListener("click", async () => {
      if (!video.paused && !video.ended) {
        video.pause();
        return;
      }
      video.defaultMuted = false;
      video.muted = false;
      video.volume = 1;
      if (video.ended || video.currentTime >= video.duration - 0.25) {
        video.currentTime = 0;
      }
      try {
        await video.play();
      } catch (error) {
        playButton.textContent = "再生できませんでした。もう一度押してください";
      }
    });

    video.addEventListener("playing", () => {
      playButton.textContent = "Ⅱ 一時停止";
    });

    video.addEventListener("pause", () => {
      if (!video.ended) playButton.textContent = "▶ 音声をオンにして続きから再生";
    });

    video.addEventListener("ended", () => {
      playButton.textContent = "▶ 音声をオンにしてもう一度再生";
    });
  </script>
</body>
</html>
