services:
  - type: web
    name: tennko-kakuninnbo
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./src/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /data/tennko.sqlite
      - key: LICENSE_ENCRYPTION_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PERSONAL_PRICE_ID
        sync: false
      - key: STRIPE_COMPANY_PRICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LICENSE_EMAIL_FROM
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
    disk:
      name: tennko-data
      mountPath: /data
      sizeGB: 5