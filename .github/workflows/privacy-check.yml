name: Scheduled privacy boundary checks

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-boundary-checks
  cancel-in-progress: false

jobs:
  privacy-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out monitor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test monitor without network access
        run: python3 -m unittest discover -s tests -p test_privacy_check.py -v
      - name: Check production privacy boundaries without credentials
        run: python3 privacy_check.py
