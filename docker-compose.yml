services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hp-app
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-}
      GOOGLE_APPS_SCRIPT_URL: ${GOOGLE_APPS_SCRIPT_URL:-}
      GOOGLE_APPS_SCRIPT_SECRET: ${GOOGLE_APPS_SCRIPT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_METRONOME_PRICE_ID: ${STRIPE_METRONOME_PRICE_ID:-}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET:-}
      METRONOME_PRICE_YEN: ${METRONOME_PRICE_YEN:-980}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: hp-site
    depends_on:
      - app
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
